name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
      # Branch-based deploy: bypasses actions/deploy-pages and its API queue.
      # force_orphan: true recreates gh-pages each run; without it peaceiris
      # reports "nothing to commit, working tree clean".
      # https://github.com/LearningCircuit/local-deep-research/pull/1588
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
