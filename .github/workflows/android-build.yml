name: android-build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # AGP 8.x requires JDK 17. If the runner default is 11, the build
      # fails with "Android Gradle plugin requires Java 17 to run."
      # https://github.com/obytes/react-native-template-obytes/issues/372
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Guarantees ANDROID_HOME is set even if the image changes. On
      # ubuntu-latest the SDK is preinstalled; this step then only accepts
      # licenses, which is required for `assembleDebug` to succeed.
      # https://github.com/android-actions/setup-android
      # https://github.com/tuist/tuist/pull/11062 (SDK location not found)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      # --stacktrace gives the exception chain in the log if the next failure
      # is a real code/dependency issue rather than an environment issue.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subvox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
